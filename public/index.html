<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>MyBirthdays Beheer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h2>Verjaardagen beheren</h2>

<div class="add-form">
    <input id="name" placeholder="Naam">
    <input id="birthdate" type="date">
    <button id="add-btn">Toevoegen</button>
</div>

<table>
    <thead>
        <tr>
            <th>Naam</th>
            <th>Geboortedatum</th>
            <th>Leeftijd</th>
            <th>Dagen</th>
            <th>Acties</th>
        </tr>
    </thead>
    <tbody id="list"></tbody>
</table>

<script src="script.js"></script>
</body>
</html>
