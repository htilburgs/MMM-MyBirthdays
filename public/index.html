<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>MyBirthdays Beheer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #222; color: white; }
        input { margin: 4px 4px 4px 0; padding: 4px; font-size: 14px; }
        button { margin: 2px; padding: 4px 8px; font-size: 14px; cursor: pointer; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { padding: 6px 10px; text-align: left; font-size: 14px; border-bottom: 1px solid #555; }
        th { font-weight: bold; }
        td button { font-size: 12px; padding: 2px 6px; }
        input[type="date"] { padding: 2px 4px; }
    </style>
</head>
<body>

<h2>Verjaardagen beheren</h2>

<div>
    <input id="name" placeholder="Naam">
    <input id="birthdate" type="date">
    <button onclick="addBirthday()">Toevoegen</button>
</div>

<table>
    <thead>
        <tr>
            <th>Naam</th>
            <th>Geboortedatum</th>
            <th>Leeftijd</th>
            <th>Dagen</th>
            <th>Acties</th>
            <th>Bewerk</th>
        </tr>
    </thead>
    <tbody id="list"></tbody>
</table>

<script src="script.js"></script>
</body>
</html>
